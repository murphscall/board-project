<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<header th:fragment="headerFragment" class="header">
    <div class="nav">
        <h2><a th:href="@{/}">Spring Boot 프로젝트</a></h2> <div class="user-area">
        <div class="user-contents">
            <ul>
                <li sec:authorize="isAnonymous()">
                    <a th:href="@{/oauth2/authorization/kakao}">로그인</a>
                </li>

                <li sec:authorize="isAuthenticated()">
                    <span th:text="${#authentication.principal.nickname} + '님'"></span>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="logout-btn">로그아웃</button>
                    </form>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/users/info}">마이페이지</a>
                </li>
            </ul>
        </div>
    </div>
    </div>
</header>

</body>
</html>
