<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<div class="board-container">

    <div class="board-header">
        <h1>자유 게시판</h1>
        <a th:href="@{/posts/new}" class="write-btn">글쓰기</a>
    </div>

    <table class="post-table">
        <thead>
        <tr>
            <th class="col-num">번호</th>
            <th class="col-title">제목</th>
            <th class="col-author">작성자</th>
            <th class="col-date">작성일</th>
            <th class="col-views">조회수</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td>
                <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">게시글 제목이 여기에 표시됩니다.</a>
            </td>
            <td th:text="${post.userId}">작성자 ID</td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2025-08-08</td>
            <td th:text="${post.viewCount}">123</td>
        </tr>
        <tr th:if="${#lists.isEmpty(posts)}">
            <td colspan="5" class="no-data">게시글이 없습니다.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination">
        <a href="#">&laquo;</a>
        <a href="#" class="active">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">&raquo;</a>
    </div>

</div>

</body>
</html>
