<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/reset.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<div class="header">
    <div class="nav">
        <h2>Spring Boot 프로젝트</h2>
        <div class="user-area">
            <div class="user-contents">
                <ul>
                    <a th:href="@{/login}">
                        <li>로그인</li>
                    </a>
                    <a th:href="@{/users/info}">
                        <li>마이페이지</li>
                    </a>
                </ul>
            </div>
        </div>
    </div>
</div>
<div class="board-container">

    <div class="board-header">
        <h1>자유 게시판</h1>
        <a th:href="@{/posts/new}" class="write-btn">글쓰기</a>
    </div>

    <table class="post-table">
        <thead>
        <tr>
            <th class="col-num">번호</th>
            <th class="col-title">제목</th>
            <th class="col-author">작성자</th>
            <th class="col-date">작성일</th>
            <th class="col-views">조회수</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${pagingResponse.content}">
            <td th:text="${post.id}">1</td>
            <td>
                <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">게시글 제목</a>
            </td>
            <td th:text="${post.nickname}"></td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}"></td>
            <td th:text="${post.viewCount}"></td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${pagingResponse.totalPages > 0}">
        <!-- 이전 -->
        <a th:if="${pagingResponse.startPages > 1}" th:href="@{/(page=${pagingResponse.startPages - 1})}">&laquo;</a>

        <th:block th:each="pageNumber : ${#numbers.sequence(pagingResponse.startPages, pagingResponse.endPages)}">
            <a th:href="@{/(page=${pageNumber})}"
               th:text="${pageNumber}"
               th:classappend="${pageNumber == pagingResponse.pageNumber} ? 'active'">
            </a>
        </th:block>
        <!-- 다음 -->
        <a th:if="${pagingResponse.endPages < pagingResponse.totalPages}"
           th:href="@{/(page=${pagingResponse.endPages + 1})}">&raquo;</a>
    </div>

</div>

</body>
</html>
